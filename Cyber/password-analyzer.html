<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Analyzer</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .card {
      width: min(620px, 100%);
      padding: 28px;
      border-radius: 20px;
      background: #1e293b;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h1 { margin-top: 0; }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .password-row {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0 16px;
      cursor: pointer;
      background: #334155;
      color: white;
    }

    .meter {
      height: 10px;
      margin: 20px 0 10px;
      border-radius: 99px;
      background: #334155;
      overflow: hidden;
    }

    #bar {
      height: 100%;
      width: 0;
      transition: .25s;
    }

    #score {
      font-size: 20px;
      font-weight: 700;
    }

    .section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #334155;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin: 8px 0;
    }

    .good { color: #4ade80; }
    .warn { color: #facc15; }
    .bad { color: #f87171; }

    .suggestion {
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      background: #0f172a;
      font-family: monospace;
      word-break: break-all;
    }

    .privacy {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Password Strength Analyzer</h1>
    <p class="subtitle">
      Analyze password quality locally in your browser.
    </p>

    <div class="password-row">
      <input
        id="password"
        type="password"
        autocomplete="off"
        placeholder="Enter a sample password"
      >
      <button id="toggle">Show</button>
    </div>

    <div class="meter">
      <div id="bar"></div>
    </div>

    <div id="score">Enter a password</div>

    <div class="section">
      <strong>Analysis</strong>
      <ul id="analysis">
        <li>Nothing analyzed yet.</li>
      </ul>
    </div>

    <div class="section">
      <strong>Stronger alternatives</strong>
      <div id="suggestions">
        Enter a password to generate alternatives.
      </div>
    </div>

    <p class="privacy">
      🔒 Your password is processed locally. This page does not send it
      anywhere.
    </p>
  </main>

<script>
const passwordInput = document.getElementById("password");
const toggle = document.getElementById("toggle");
const bar = document.getElementById("bar");
const score = document.getElementById("score");
const analysis = document.getElementById("analysis");
const suggestions = document.getElementById("suggestions");

toggle.addEventListener("click", () => {
  const hidden = passwordInput.type === "password";
  passwordInput.type = hidden ? "text" : "password";
  toggle.textContent = hidden ? "Hide" : "Show";
});

passwordInput.addEventListener("input", analyze);

const commonPasswords = [
  "password",
  "123456",
  "12345678",
  "qwerty",
  "letmein",
  "welcome",
  "admin",
  "password1",
  "iloveyou",
  "abc123"
];

function analyze() {
  const p = passwordInput.value;

  if (!p) {
    score.textContent = "Enter a password";
    bar.style.width = "0";
    analysis.innerHTML = "<li>Nothing analyzed yet.</li>";
    suggestions.textContent =
      "Enter a password to generate alternatives.";
    return;
  }

  let points = 0;
  const findings = [];

  // Length
  if (p.length >= 16) {
    points += 35;
    findings.push(["good", "Good length (16+ characters)."]);
  } else if (p.length >= 12) {
    points += 25;
    findings.push(["good", "Reasonable length."]);
  } else if (p.length >= 8) {
    points += 15;
    findings.push(["warn", "Consider using 16+ characters."]);
  } else {
    findings.push(["bad", "Too short. Use at least 12–16 characters."]);
  }

  // Character variety
  if (/[a-z]/.test(p)) points += 8;
  if (/[A-Z]/.test(p)) points += 8;
  if (/[0-9]/.test(p)) points += 8;
  if (/[^A-Za-z0-9]/.test(p)) points += 8;

  // Common password
  if (commonPasswords.includes(p.toLowerCase())) {
    points = Math.min(points, 15);
    findings.push(["bad", "This is a very common password."]);
  }

  // Repetition
  if (/(.)\1{2,}/.test(p)) {
    points -= 10;
    findings.push(["warn", "Contains repeated characters."]);
  }

  // Sequential characters
  if (
    /1234|2345|3456|4567|5678|6789|abcd|bcde|cdef|qwerty/i.test(p)
  ) {
    points -= 10;
    findings.push(["warn", "Contains a predictable sequence."]);
  }

  // Keyboard patterns
  if (/qwerty|asdf|zxcv|qazwsx/i.test(p)) {
    points -= 10;
    findings.push(["warn", "Contains a common keyboard pattern."]);
  }

  points = Math.max(0, Math.min(100, points));

  let label;
  let color;

  if (points < 30) {
    label = "Very weak";
    color = "#f87171";
  } else if (points < 55) {
    label = "Weak";
    color = "#fb923c";
  } else if (points < 75) {
    label = "Moderate";
    color = "#facc15";
  } else if (points < 90) {
    label = "Strong";
    color = "#4ade80";
  } else {
    label = "Very strong";
    color = "#22c55e";
  }

  score.textContent = `${label} — ${points}/100`;
  score.style.color = color;
  bar.style.width = `${points}%`;
  bar.style.background = color;

  analysis.innerHTML = findings.length
    ? findings.map(([cls, text]) =>
        `<li class="${cls}">${text}</li>`
      ).join("")
    : "<li class='good'>No obvious weaknesses detected.</li>";

  generateSuggestions(p);
}

function randomWord() {
  const words = [
    "copper", "forest", "planet", "violet", "river",
    "lantern", "falcon", "orbit", "meadow", "cactus",
    "silver", "thunder", "maple", "rocket", "harbor",
    "sunset", "panda", "comet", "marble", "willow"
  ];

  return words[Math.floor(Math.random() * words.length)];
}

function generateSuggestions(original) {
  const suggestionsList = [];

  for (let i = 0; i < 3; i++) {
    const candidate =
      `${randomWord()}-${randomWord()}-${randomWord()}-${randomWord()}!${Math.floor(10 + Math.random() * 90)}`;

    suggestionsList.push(candidate);
  }

  suggestions.innerHTML = suggestionsList
    .map(p => `<div class="suggestion">${escapeHtml(p)}</div>`)
    .join("");
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[char]));
}
</script>
</body>
</html>
